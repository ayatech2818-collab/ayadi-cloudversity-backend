[project]
name = "ayadi-website-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adil-Aadhi", email = "adilshinasmongam@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.101",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ayadi-website-backend = "ayadi_website_backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
